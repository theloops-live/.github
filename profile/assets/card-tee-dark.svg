<svg xmlns="http://www.w3.org/2000/svg" width="620" height="230" viewBox="0 0 620 230" role="img" aria-label="ffmpeg-tee-builder: FFmpeg -f tee for many RTMP servers at once: one dead destination can't stop the others.">
<style>
  .sans{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  @media (prefers-reduced-motion: reduce){ *{animation:none!important} }
</style>
<rect x="0.5" y="0.5" width="619" height="229" rx="16" fill="#171a1c" stroke="#262a2d"/>
<text x="28" y="44" class="mono" font-size="12" letter-spacing="2" fill="#9ba0ff">PYTHON · FFMPEG · CLI</text>
<text x="28" y="82" class="sans" font-size="26" font-weight="700" fill="#e8e6e1">ffmpeg-tee-builder</text>
<text x="28" y="114" class="sans" font-size="15" fill="#c4c2bc">FFmpeg -f tee for many RTMP servers at once:</text>
<text x="28" y="136" class="sans" font-size="15" fill="#c4c2bc">one dead destination can't stop the others.</text>
<rect x="28" y="160" width="564" height="44" rx="10" fill="#101112" stroke="#262a2d"/>
<text x="46" y="188" class="mono" font-size="14" fill="#e8e6e1"><tspan fill="#9ba0ff">$</tspan> ffmpeg-tee-builder rtmp://a/KEY rtmp://b/KEY</text>
<rect x="448" y="174" width="9" height="18" fill="#9ba0ff"><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></rect>
</svg>